<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>이영선을 소개합니다</h1>
        <button id="theme-btn">다크모드 전환</button>
    </header>

    <main class="cards">
        <article class="card">
            <img src="https://placehold.co/120x120" alt="이영선 프로필 사진">
            <h2>이영선</h2>
            <p class="role">디지털금융 MBA</p>
            <p>가계부채 관련 분석을 합니다.</p>
            <a href="https://github.com">GitHub 프로필</a>
        </article>
        <article class="card">
            <h2>관심 분야</h2>
            <p class="role">무엇을 파고드나</p>
            <p>Accounting, Text analysis, Datamining, 그리고 식물. 사주에 나무가 부족하다고 해서 나무들을 직접 키워보고 있습니다.</p>
        </article>
        <article class="card">
            <h2>연동 실습</h2>
            <p class="role">React + FastAPI + Supabase</p>
            <p>프론트엔드에서 백엔드 API를 호출해 메모를 저장하는 풀스택 실습입니다.</p>
            <a href="https://memo-frontend-nu.vercel.app/" target="_blank">프로젝트 보러가기</a>
        </article>
    </main>
<script src="script.js"></script>
</body>
</html>
